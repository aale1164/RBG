<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>خدمة المواطن | Citizen Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- مكتبات خارجية (jsPDF, html2canvas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #0a192f;
      --secondary: #112240;
      --accent: #d4a017;
      --gold: #f0c040;
      --text: #e6f1ff;
      --text-muted: #8892b0;
      --border: #1e3a5f;
      --font-ar: 'Tajawal', 'Cairo', 'El Messiri', sans-serif;
      --font-en: 'Inter', sans-serif;
      --sidebar-width: 280px;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-ar);
      background-color: var(--primary);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--secondary);
      border-left: 2px solid var(--gold);
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      z-index: 100;
      transition: var(--transition);
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0a192f, #1e3a5f);
    }
    .sidebar-header .logo-icon { font-size: 3rem; color: var(--gold); margin-bottom: 5px; }
    .sidebar-header h2 { font-family: 'El Messiri', sans-serif; font-size: 1.6rem; color: var(--gold); margin: 0; }
    .sidebar-header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
    .sidebar-nav { flex: 1; padding: 15px 0; }
    .sidebar-nav .category-title {
      padding: 12px 20px 5px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 1px;
      font-weight: 700;
      opacity: 0.8;
    }
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: var(--transition);
      border-right: 3px solid transparent;
      margin: 2px 0;
    }
    .sidebar-nav a i { width: 24px; font-size: 1.2rem; text-align: center; color: var(--accent); }
    .sidebar-nav a:hover, .sidebar-nav a.active {
      background: rgba(212, 160, 23, 0.1);
      color: var(--gold);
      border-right-color: var(--gold);
      font-weight: 500;
    }
    .sidebar-footer {
      padding: 15px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .main-content {
      margin-right: var(--sidebar-width);
      flex: 1;
      padding: 25px;
      position: relative;
      z-index: 1;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: var(--secondary);
      padding: 15px 25px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .top-header .header-left h1 { font-family: 'El Messiri', sans-serif; font-size: 1.8rem; color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .x-link {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #000;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: var(--transition);
      border: 1px solid #333;
    }
    .x-link:hover { background: #1a1a1a; border-color: var(--gold); transform: translateY(-2px); }
    .lang-switch {
      background: var(--primary);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 15px;
      border-radius: 30px;
      cursor: pointer;
      font-family: var(--font-en);
      transition: var(--transition);
    }
    .lang-switch:hover { border-color: var(--gold); }
    .tool-container {
      background: var(--secondary);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      min-height: 500px;
    }
    .tool-header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .tool-header i { font-size: 2.2rem; color: var(--gold); }
    .tool-header h2 { font-family: 'El Messiri', sans-serif; font-size: 1.8rem; color: var(--text); }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #b8860b);
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,160,23,0.3); }
    input, textarea, select {
      background: var(--primary);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-family: inherit;
      width: 100%;
      margin: 10px 0;
    }
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .preview-box {
      background: var(--primary);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(100%); width: 260px; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
      .menu-toggle {
        display: block;
        background: var(--accent);
        border: none;
        color: #000;
        font-size: 1.5rem;
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
      <h2>خدمة المواطن</h2>
      <p>بوابتك الإلكترونية الشاملة</p>
    </div>
    <nav class="sidebar-nav">
      <div class="category-title">الأدوات الرئيسية</div>
      <a href="#" data-tool="dashboard" class="active"><i class="fas fa-th-large"></i> لوحة التحكم</a>
      <a href="#" data-tool="cv-builder"><i class="fas fa-file-alt"></i> منشئ السيرة الذاتية</a>
      <a href="#" data-tool="img-to-pdf"><i class="fas fa-file-pdf"></i> صور إلى PDF</a>
      <a href="#" data-tool="bg-remover"><i class="fas fa-eraser"></i> مزيل الخلفية</a>
      <a href="#" data-tool="video-translator"><i class="fas fa-language"></i> مترجم الفيديو</a>
      <!-- باقي الأقسام ستكون جاهزة لاحقاً -->
    </nav>
    <div class="sidebar-footer">© 2026 Citizen Services</div>
  </aside>

  <main class="main-content" id="mainContent">
    <header class="top-header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" style="display:none;"><i class="fas fa-bars"></i></button>
        <h1>خدمة المواطن</h1>
      </div>
      <div class="header-right">
        <a href="https://x.com/aale1164" target="_blank" class="x-link"><i class="fab fa-x-twitter"></i> @aale1164</a>
        <button class="lang-switch" id="langSwitch">English</button>
      </div>
    </header>
    <div id="toolContainer" class="tool-container"></div>
  </main>

  <script>
    (function() {
      // ========== Multi-language ==========
      const translations = {
        ar: {
          'dashboard': 'لوحة التحكم',
          'cv': 'منشئ السيرة الذاتية',
          'img2pdf': 'صور إلى PDF',
          'bg-remover': 'مزيل الخلفية',
          'video-translator': 'مترجم الفيديو'
        },
        en: {
          'dashboard': 'Dashboard',
          'cv': 'CV Builder',
          'img2pdf': 'Images to PDF',
          'bg-remover': 'Background Remover',
          'video-translator': 'Video Translator'
        }
      };
      let currentLang = 'ar';

      // ========== Tool implementations ==========
      const tools = {
        dashboard: {
          icon: 'fa-th-large',
          title: { ar: 'لوحة التحكم', en: 'Dashboard' },
          render: () => `<div style="text-align:center; padding:40px;"><i class="fas fa-cogs" style="font-size:4rem; color:var(--gold); opacity:0.6;"></i><h2>مرحباً بك في خدمة المواطن</h2><p style="color:var(--text-muted);">اختر أداة من القائمة الجانبية لبدء العمل.</p></div>`
        },
        'cv-builder': {
          icon: 'fa-file-alt',
          title: { ar: 'منشئ السيرة الذاتية', en: 'CV Builder' },
          render: () => {
            const lang = currentLang;
            const labels = lang === 'ar' ? ['الاسم الكامل', 'المسمى الوظيفي', 'الخبرات', 'المهارات'] : ['Full Name', 'Job Title', 'Experience', 'Skills'];
            return `
              <div class="row">
                <div style="flex:1;">
                  <input id="cvName" placeholder="${labels[0]}">
                  <input id="cvTitle" placeholder="${labels[1]}">
                  <textarea id="cvExp" placeholder="${labels[2]}" rows="4"></textarea>
                  <input id="cvSkills" placeholder="${labels[3]}">
                  <button class="btn-primary" onclick="generateCV()"><i class="fas fa-magic"></i> ${lang === 'ar' ? 'إنشاء السيرة' : 'Generate CV'}</button>
                  <button class="btn-primary" onclick="downloadCV()" style="margin-top:10px;"><i class="fas fa-download"></i> ${lang === 'ar' ? 'تحميل PDF' : 'Download PDF'}</button>
                </div>
                <div style="flex:1;">
                  <div id="cvPreview" class="preview-box" style="flex-direction:column; text-align:right; background:#fff; color:#000; padding:30px;">
                    <h2 id="prevName" style="color:#1e3a5f;"></h2>
                    <h3 id="prevTitle" style="color:#555;"></h3>
                    <p id="prevExp" style="white-space:pre-wrap;"></p>
                    <p id="prevSkills" style="font-weight:bold;"></p>
                  </div>
                </div>
              </div>
            `;
          },
          onLoad: () => {
            window.generateCV = () => {
              document.getElementById('prevName').textContent = document.getElementById('cvName').value;
              document.getElementById('prevTitle').textContent = document.getElementById('cvTitle').value;
              document.getElementById('prevExp').textContent = document.getElementById('cvExp').value;
              document.getElementById('prevSkills').textContent = document.getElementById('cvSkills').value;
            };
            window.downloadCV = async () => {
              const preview = document.getElementById('cvPreview');
              const canvas = await html2canvas(preview);
              const imgData = canvas.toDataURL('image/png');
              const { jsPDF } = window.jspdf;
              const pdf = new jsPDF('p', 'mm', 'a4');
              pdf.addImage(imgData, 'PNG', 10, 10, 190, 0);
              pdf.save('السيرة_الذاتية.pdf');
            };
          }
        },
        'img-to-pdf': {
          icon: 'fa-file-pdf',
          title: { ar: 'صور إلى PDF', en: 'Images to PDF' },
          render: () => `
            <input type="file" id="imgInput" accept="image/*" multiple>
            <div id="imagePreview" class="row" style="margin:20px 0;"></div>
            <button class="btn-primary" onclick="convertToPdf()"><i class="fas fa-file-export"></i> ${currentLang === 'ar' ? 'تحويل إلى PDF' : 'Convert to PDF'}</button>
          `,
          onLoad: () => {
            document.getElementById('imgInput').addEventListener('change', function(e) {
              const files = e.target.files;
              const preview = document.getElementById('imagePreview');
              preview.innerHTML = '';
              Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                  const img = document.createElement('img');
                  img.src = ev.target.result;
                  img.style.width = '100px';
                  img.style.margin = '5px';
                  preview.appendChild(img);
                };
                reader.readAsDataURL(file);
              });
            });
            window.convertToPdf = () => {
              const files = document.getElementById('imgInput').files;
              if (!files.length) return alert('اختر صوراً أولاً');
              const { jsPDF } = window.jspdf;
              const pdf = new jsPDF();
              Array.from(files).forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                  pdf.addImage(ev.target.result, 'JPEG', 10, 10, 190, 0);
                  if (idx < files.length - 1) pdf.addPage();
                  if (idx === files.length - 1) pdf.save('صور_مدمجة.pdf');
                };
                reader.readAsDataURL(file);
              });
            };
          }
        },
        'bg-remover': {
          icon: 'fa-eraser',
          title: { ar: 'مزيل الخلفية', en: 'Background Remover' },
          render: () => `
            <input type="file" id="bgInput" accept="image/*">
            <div id="bgResult" class="preview-box" style="min-height:300px;">المعاينة هنا</div>
            <button class="btn-primary" onclick="removeBg()"><i class="fas fa-cut"></i> ${currentLang === 'ar' ? 'إزالة الخلفية' : 'Remove Background'}</button>
          `,
          onLoad: () => {
            window.removeBg = async () => {
              const file = document.getElementById('bgInput').files[0];
              if (!file) return;
              const img = new Image();
              img.src = URL.createObjectURL(file);
              await img.decode();
              // Placeholder: would use TensorFlow.js or an API. For now, show original.
              document.getElementById('bgResult').innerHTML = `<img src="${img.src}" style="max-width:100%;">`;
              alert('سيتم قريباً دمج مكتبة إزالة الخلفية مباشرة في المتصفح.');
            };
          }
        },
        'video-translator': {
          icon: 'fa-language',
          title: { ar: 'مترجم الفيديو', en: 'Video Translator' },
          render: () => {
            const lang = currentLang;
            return `
              <input type="file" accept="video/*">
              <div class="row" style="margin-top:20px;">
                <div style="flex:1;">
                  <label>${lang === 'ar' ? 'نص الترجمة' : 'Subtitle Text'}</label>
                  <input id="subtitleText" placeholder="${lang === 'ar' ? 'أدخل النص' : 'Enter text'}">
                  <label>${lang === 'ar' ? 'نوع الخط' : 'Font'}</label>
                  <select id="fontSelect" onchange="updateFontPreview()">
                    <option value="Tajawal">Tajawal</option>
                    <option value="Cairo">Cairo</option>
                    <option value="El Messiri">El Messiri</option>
                    <option value="Arial">Arial</option>
                  </select>
                  <label>${lang === 'ar' ? 'اللون' : 'Color'}</label>
                  <input type="color" id="fontColor" value="#ffffff" onchange="updateFontPreview()">
                </div>
                <div style="flex:1;">
                  <label>${lang === 'ar' ? 'معاينة الخط' : 'Font Preview'}</label>
                  <canvas id="fontPreviewCanvas" width="300" height="80" style="border:1px solid var(--border); border-radius:12px; background:#000;"></canvas>
                </div>
              </div>
              <button class="btn-primary" style="margin-top:20px;"><i class="fas fa-cc"></i> ${lang === 'ar' ? 'تطبيق الترجمة' : 'Apply Subtitles'}</button>
            `;
          },
          onLoad: () => {
            window.updateFontPreview = () => {
              const canvas = document.getElementById('fontPreviewCanvas');
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = '#000';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              const font = document.getElementById('fontSelect').value;
              const color = document.getElementById('fontColor').value;
              const text = document.getElementById('subtitleText').value || 'نموذج Subtitle';
              ctx.font = `24px "${font}"`;
              ctx.fillStyle = color;
              ctx.textAlign = 'center';
              ctx.fillText(text, canvas.width/2, canvas.height/2+8);
            };
            // initial preview
            setTimeout(updateFontPreview, 200);
          }
        }
      };

      // ========== Core functions ==========
      const toolContainer = document.getElementById('toolContainer');
      const sidebarLinks = document.querySelectorAll('.sidebar-nav a[data-tool]');
      const menuToggle = document.getElementById('menuToggle');
      const sidebar = document.getElementById('sidebar');
      const langSwitch = document.getElementById('langSwitch');

      function loadTool(toolId) {
        const tool = tools[toolId];
        if (!tool) return;
        const title = tool.title[currentLang];
        toolContainer.innerHTML = `
          <div class="tool-header">
            <i class="fas ${tool.icon}"></i>
            <h2>${title}</h2>
          </div>
          <div>${tool.render()}</div>
        `;
        sidebarLinks.forEach(a => a.classList.remove('active'));
        document.querySelector(`.sidebar-nav a[data-tool="${toolId}"]`)?.classList.add('active');
        if (tool.onLoad) setTimeout(tool.onLoad, 0);
      }

      function switchLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        langSwitch.textContent = currentLang === 'ar' ? 'English' : 'العربية';
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.body.style.fontFamily = currentLang === 'ar' ? 'var(--font-ar)' : 'var(--font-en)';
        const activeTool = document.querySelector('.sidebar-nav a.active');
        if (activeTool) loadTool(activeTool.getAttribute('data-tool'));
      }

      sidebarLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          loadTool(this.getAttribute('data-tool'));
          if (window.innerWidth <= 768) sidebar.classList.remove('open');
        });
      });

      menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
      langSwitch.addEventListener('click', switchLanguage);

      // Load dashboard on start
      loadTool('dashboard');
    })();
  </script>
</body>
</html>
